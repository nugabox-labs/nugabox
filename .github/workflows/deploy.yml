name: Deploy nugabox

on:
  push:
    branches:
      - main

concurrency:
  group: nugabox-deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /volume1/Develop/webapps/nugabox

jobs:
  build:
    runs-on: [self-hosted, linux, x64, nugacloud]
    outputs:
      head_sha: ${{ steps.prep.outputs.head_sha }}
      deploy_info_file: ${{ steps.prep.outputs.deploy_info_file }}

    steps:
      - name: Prepare deploy info
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          DI="/tmp/nugabox-deploy-${GITHUB_RUN_ID}.txt"
          echo "deploy_info_file=$DI" >> "$GITHUB_OUTPUT"
          echo "head_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

          {
            echo "Timestamp (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Repo: ${GITHUB_REPOSITORY}"
            echo "Ref: ${GITHUB_REF_NAME}"
            echo "SHA: ${GITHUB_SHA}"
            echo "Deploy dir: ${{ env.DEPLOY_DIR }}"
          } > "$DI"

  report-build-status:
    needs: build
    runs-on: [self-hosted, linux, x64, nugacloud]

    steps:
      - name: Build status
        shell: bash
        run: |
          set -euo pipefail
          echo "build ok"

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, nugacloud]

    steps:
      - name: Deploy on Production Server
        id: deploy
        shell: bash
        env:
          DEPLOY_INFO_FILE: ${{ needs.build.outputs.deploy_info_file }}
        run: |
          set -euo pipefail

          DEPLOY_DIR="${{ env.DEPLOY_DIR }}"

          step_time() {
            echo "[timing] $1 — $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          }

          cd "$DEPLOY_DIR"

          # 관리자(PHP-FPM)가 같은 저장소에 커밋하므로 .git 안에 다른 사용자
          # 소유 파일이 섞인다. safe.directory 를 명시해 소유권 검사에 걸리지 않게 한다.
          GIT="git -c safe.directory=${DEPLOY_DIR}"

          step_time "git sync start"
          $GIT fetch origin main
          $GIT reset --hard origin/main
          CUR="$($GIT rev-parse HEAD)"
          step_time "git sync done"

          {
            echo ""
            echo "HEAD: $CUR"
            echo ""
            $GIT log -1 --oneline
          } >> "$DEPLOY_INFO_FILE"

          # 알림에서 쓸 값
          {
            echo "DEPLOY_SUBJECT=$($GIT log -1 --pretty=%s | tr -d '\n')"
            echo "DEPLOY_AUTHOR=$($GIT log -1 --pretty=%an | tr -d '\n')"
          } >> "$GITHUB_ENV"

      - name: Send Success Notification
        if: success()
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          GH_SERVER: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_STATUS: success
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        run: |
          set -e
          if [ -z "${MATTERMOST_WEBHOOK_URL:-}" ]; then echo "MATTERMOST_WEBHOOK_URL 없음 — 알림 생략"; exit 0; fi
          PYBIN="$(command -v python3 2>/dev/null || command -v python 2>/dev/null || true)"
          if [ -z "$PYBIN" ]; then echo "python 없음 — 알림 생략"; exit 0; fi
          SCRIPT="${DEPLOY_DIR}/.github/mattermost_notify.py"
          if [ ! -f "$SCRIPT" ]; then echo "알림 스크립트 없음 ($SCRIPT) — 생략"; exit 0; fi
          "$PYBIN" "$SCRIPT"

      - name: Send Failure Notification
        if: failure()
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          GH_SERVER: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_STATUS: failure
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DEPLOY_INFO_FILE: ${{ needs.build.outputs.deploy_info_file }}
        run: |
          set -e
          if [ -z "${MATTERMOST_WEBHOOK_URL:-}" ]; then echo "MATTERMOST_WEBHOOK_URL 없음 — 알림 생략"; exit 0; fi
          PYBIN="$(command -v python3 2>/dev/null || command -v python 2>/dev/null || true)"
          if [ -z "$PYBIN" ]; then echo "python 없음 — 알림 생략"; exit 0; fi
          SCRIPT="${DEPLOY_DIR}/.github/mattermost_notify.py"
          if [ ! -f "$SCRIPT" ]; then echo "알림 스크립트 없음 ($SCRIPT) — 생략"; exit 0; fi
          "$PYBIN" "$SCRIPT"
